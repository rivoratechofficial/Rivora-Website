<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rivora Tech Solutions – Apps, AI, Robotics and Immersive Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#fff3e0;--ink:#16120c;--mut:#5e574b;--pink:#F39A0F;--mint:#C25E00;--grad:linear-gradient(135deg,#F9AA14,#E06F00);--line:rgba(22,18,12,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.disp{font-family:Unbounded,Figtree,system-ui,sans-serif;line-height:1.08;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #E06F00;outline-offset:3px}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) 28px 14px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.logo img{height:42px;width:auto;transition:transform .6s}.logo:hover img{transform:rotate(60deg)}
.logo{font:900 20px Unbounded,sans-serif;display:flex;align-items:center;gap:10px}
.logo i{width:22px;height:22px;border-radius:50%;border:3px solid var(--pink);position:relative;animation:spin 6s linear infinite}
.logo i::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--mint);top:-6px;left:5px}
@keyframes spin{to{transform:rotate(360deg)}}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:99px;font-weight:500;font-size:15px;transition:background .25s}
nav a:hover,nav a.on{background:var(--bg2)}
nav a.cta{background:var(--grad);color:var(--ink);font-weight:600}
main{min-height:100vh}
section{padding:96px 6vw;position:relative}
.wrap{max-width:1150px;margin:0 auto}
.hero{min-height:100vh;display:flex;align-items:center;padding-top:130px;overflow:hidden}
.hero canvas,.vis{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;z-index:2;pointer-events:none}.hero a,.hero button{pointer-events:auto}
h1{font-size:clamp(38px,7.4vw,104px);font-weight:900}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em}
h1 .w span{display:inline-block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes up{to{transform:none}}
h2{font-size:clamp(28px,4.2vw,56px);font-weight:700;margin-bottom:20px}
h3{font-size:19px;font-weight:700;margin-bottom:8px}
.lede{font-size:clamp(18px,2vw,23px);color:var(--mut);max-width:640px;margin:26px 0 34px}
.btn{display:inline-block;padding:15px 28px;border-radius:99px;font-weight:600;background:var(--grad);color:var(--ink);border:0;font:600 16px Figtree;cursor:pointer;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px -8px #E06F00}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink);margin-left:10px}
.mq{overflow:hidden;background:var(--ink);color:#fff;padding:18px 0;white-space:nowrap}
.mq div{display:inline-block;animation:mq 28s linear infinite;font:700 clamp(20px,3vw,34px) Unbounded,sans-serif}
.mq span{margin:0 28px;color:#8d8576}.mq b{color:#F9AA14}
@keyframes mq{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:40px}
.card{background:var(--bg2);border-radius:26px 6px 26px 6px;padding:28px;transition:transform .2s;transform-style:preserve-3d;position:relative;overflow:hidden;display:block}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--mint) 28%,transparent),transparent);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.card p{color:var(--mut);font-size:15.5px;position:relative}.card h3,.card .ic{position:relative}
.ic{font-size:34px;display:block;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:30px;margin-top:20px}
.stats b{font:900 clamp(40px,6vw,72px) Unbounded,sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chips span{border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:14px}
.steps{counter-reset:s;display:grid;gap:0;margin-top:34px;border-left:2px solid var(--line)}
.steps div{padding:0 0 30px 34px;position:relative}
.steps div::before{counter-increment:s;content:counter(s);position:absolute;left:-17px;top:-2px;width:32px;height:32px;border-radius:50%;background:var(--grad);color:var(--ink);display:grid;place-items:center;font:700 14px Unbounded}
.steps p,.two p{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
@media(max-width:800px){.two{grid-template-columns:1fr}nav a{padding:6px 9px;font-size:13px}header{padding-inline:14px}.logo span{display:none}}
.stage{position:relative;height:420px;background:var(--bg2);border-radius:40px 8px 40px 8px;overflow:hidden}
.page-hero{padding-top:150px;position:relative;overflow:hidden;min-height:68vh;display:flex;align-items:center}
.quote{font:500 clamp(20px,2.4vw,28px)/1.4 Figtree;max-width:760px}
.logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:36px}
.logos div{border:1px solid var(--line);border-radius:20px;padding:34px 20px;text-align:center;font:700 20px Unbounded;transition:background .3s,color .3s,transform .3s}
.logos div:hover{background:var(--grad);color:var(--ink);transform:rotate(-2deg) scale(1.03)}
.logos small{display:block;font:400 13px Figtree;opacity:.7;margin-top:4px}
form{display:grid;gap:16px;max-width:560px}
label{font-weight:600;font-size:15px;display:grid;gap:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:2px solid transparent;border-radius:14px;padding:14px;transition:border-color .25s}
input:focus,select:focus,textarea:focus{border-color:var(--mint);outline:0}
#ok{display:none;padding:18px;border-radius:14px;background:var(--grad);color:var(--ink);font-weight:600}
footer{padding:50px 6vw;align-items:center;border-top:1px solid var(--line);color:var(--mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
#wipe{position:fixed;inset:0;z-index:50;background:var(--grad);clip-path:circle(0% at 50% 50%);pointer-events:none;transition:clip-path .5s cubic-bezier(.7,0,.3,1)}
#wipe.on{clip-path:circle(150% at 50% 50%)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
#glow{position:fixed;width:340px;height:340px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--pink) 22%,transparent),transparent 65%);transform:translate(-50%,-50%);z-index:1;left:-999px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 .w span{transform:none}.rv{opacity:1;transform:none}#glow{display:none}}
</style>
</head>

function viz(cv,mode){
 const c=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let W,H;

 const R=Math.random,N=mode==='net'?90:60,P=[...Array(N)].map(()=>({x:R()*W,y:R()*H,vx:R()-.5,vy:R()-.5,k:R()*3|0,p:R()*6}));

 const lc='rgba(22,18,12,.25)';
 let t=0;
 const f=()=>{t+=.016;c.clearRect(0,0,W,H);const r=cv.getBoundingClientRect(),mx=mouse.x-r.left,my=mouse.y-r.top;
 if(mode==='net'||mode==='ml'){

  P.forEach((p,i)=>{
   if(mode==='ml'){const k=cen[(p.k+Math.floor(t/3))%3];p.x+=(k[0]+Math.sin(p.p+t)*50-p.x)*.02;p.y+=(k[1]+Math.cos(p.p*2+t)*40-p.y)*.02}
   else{p.x+=p.vx*.6;p.y+=p.vy*.6;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<140){p.x+=dx/d*2.2;p.y+=dy/d*2.2}}
   dot(p.x,p.y,2.6,[PINK,MINT,INK][p.k]);
   if(mode==='net')for(let j=i+1;j<N;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){c.globalAlpha=1-d/120;line([p.x,p.y],[q.x,q.y],lc);c.globalAlpha=1}}
  })}
 else if(mode==='ai'){const L=[4,6,6,3],pos=L.map((n,i)=>[...Array(n)].map((_,j)=>[W*(.12+i*.25),H*(.5+(j-(n-1)/2)*.13)]));
  pos.forEach((l,i)=>i<3&&l.forEach((a,x)=>pos[i+1].forEach((b,y)=>{line(a,b,'rgba(22,18,12,.25)');const s=(t*.6+x*.13+y*.07+i*.3)%1;dot(a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s,2.5,MINT)})));
  pos.flat().forEach(a=>dot(a[0],a[1],8+Math.sin(t*3+a[0])*1.5,PINK))}
 else if(mode==='robotics'){const bx=W/2,by=H*.85,a1=-1.1+Math.sin(t)*.6,a2=1.2+Math.sin(t*1.7)*.8,l=H*.34,e=[bx+Math.cos(a1)*l,by+Math.sin(a1)*l],h=[e[0]+Math.cos(a1+a2)*l*.8,e[1]+Math.sin(a1+a2)*l*.8];
  P.length=0;(window._tr=window._tr||[]).push(h);if(_tr.length>80)_tr.shift();_tr.forEach((q,i)=>dot(q[0],q[1],i/30,MINT));
  line([bx,by],e,PINK,14);line(e,h,PINK,10);dot(bx,by,18,INK);dot(e[0],e[1],11,INK);dot(h[0],h[1],8,MINT)}
 else if(mode==='iot'){const g=[];for(let i=0;i<5;i++)for(let j=0;j<4;j++)g.push([W*(.12+i*.19)+(j%2)*30,H*(.15+j*.23)]);
  g.forEach((a,i)=>{g.forEach((b,j)=>j>i&&Math.hypot(a[0]-b[0],a[1]-b[1])<W*.24&&line(a,b,'rgba(22,18,12,.25)'));const s=(t*.5+i*.17)%1;c.strokeStyle=MINT;c.globalAlpha=1-s;c.beginPath();c.arc(a[0],a[1],s*50,0,7);c.stroke();c.globalAlpha=1;dot(a[0],a[1],6,PINK)})}
 else if(mode==='arvr'){const V=[];for(let i=0;i<8;i++)V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1]);
  const pr=v=>{let[x,y,z]=v,ca=Math.cos(t),sa=Math.sin(t),cb=Math.cos(t*.7),sb=Math.sin(t*.7);[x,z]=[x*ca-z*sa,x*sa+z*ca];[y,z]=[y*cb-z*sb,y*sb+z*cb];const s=1/(3.5-z);return[W/2+x*s*W*.42,H/2+y*s*W*.42]};
  const q=V.map(pr);V.forEach((a,i)=>V.forEach((b,j)=>j>i&&(a[0]!=b[0])+(a[1]!=b[1])+(a[2]!=b[2])==1&&line(q[i],q[j],j%2?PINK:MINT,3)));q.forEach(p=>dot(p[0],p[1],5,INK))}
 raf=requestAnimationFrame(f)};
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){t=2;f();cancelAnimationFrame(raf)}else f();
}

/* router */
const app=$('#app');
function view(h){h=h||'home';if(PAGES[h])return PAGES[h]();const[k,id]=h.split(/-(.+)/);if(k==='service'&&SV[id])return svc(id);if(k==='tech'&&TK[id])return tech(id);return PAGES.home()}
function mount(h){
 cancelAnimationFrame(raf);window._tr=[];app.innerHTML=view(h);scrollTo(0,0);
 $$('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(h.startsWith('service')?'services':h.startsWith('tech-')?'tech':h)));
 const cv=$('#hc')||$('canvas.vis');if(cv)viz(cv,cv.dataset.m||(h==='home'?'net':(h.startsWith('service')?'ml':'net')));
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);$$('[data-n]',e.target).forEach(count)}}),{threshold:.15});
 $$('.rv').forEach(e=>io.observe(e));$$('[data-n]').forEach(e=>io.observe(e.closest('.stats')||e));
 $$('.card').forEach(c=>c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.style.transform=`perspective(700px) rotateY(${(x-.5)*8}deg) rotateX(${(.5-y)*8}deg)`}),c.addEventListener('pointerleave',()=>c.style.transform=''));
 const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();const o=$('#ok');o.style.display='block';o.textContent=`Thanks, ${f.n.value}. Your message is ready for our team. (Demo form: nothing is sent from this page.)`;f.reset()}}
function count(e){if(e.dataset.d)return;e.dataset.d=1;const n=+e.dataset.n,s=performance.now();(function u(t){const p=Math.min((t-s)/1400,1);e.textContent=Math.round(n*(1-Math.pow(1-p,3)))+(p==1?(e.dataset.x||'+'):'');p<1&&requestAnimationFrame(u)})(s)}
let first=true;
function go(){const h=location.hash.slice(1);if(first){first=false;mount(h);return}const w=$('#wipe');w.classList.add('on');setTimeout(()=>{mount(h);w.classList.remove('on')},520)}
addEventListener('hashchange',go);go();
</script>
